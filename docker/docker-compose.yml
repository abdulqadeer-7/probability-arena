version: "3.8"

networks:
  aero-arcade:
    driver: bridge

volumes:
  postgres-data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: aeroarcade-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    networks:
      - aero-arcade
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aeroarcade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aeroarcade}
      POSTGRES_DB: ${POSTGRES_DB:-aeroarcade}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aeroarcade} -d ${POSTGRES_DB:-aeroarcade}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: aeroarcade-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - aero-arcade
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: aeroarcade-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    networks:
      - aero-arcade
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../.env

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: aeroarcade-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - aero-arcade
    depends_on:
      - backend
    env_file:
      - ../.env
